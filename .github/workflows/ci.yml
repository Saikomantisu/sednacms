name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The auth and content API tests run against a real database. Each test
    # creates its own schema and drops it afterwards.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SEDNA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Type-check field types
        run: npm run test:types -w sednacms

      # The content API test starts the built playground server.
      - name: Build playground
        run: npm run build -w sednacms-playground

      - name: Test
        run: npm test -w sednacms

  # Workspace links can hide files or dependencies missing from the published
  # package, so build the playground against the packed tarball as well.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install
        run: npm ci
      - name: Pack
        run: npm pack -w sednacms --pack-destination "$RUNNER_TEMP"
      - name: Build playground from the tarball
        run: |
          site="$RUNNER_TEMP/site"
          cp -R apps/playground "$site"
          cd "$site"
          npm pkg set dependencies.sednacms="file:$(ls "$RUNNER_TEMP"/sednacms-*.tgz)"
          npm install --no-audit --no-fund
          npm run build

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Install
        run: npm ci
      - name: Check documentation
        run: npm run docs:check
      - name: Build documentation
        run: npm run docs:build
