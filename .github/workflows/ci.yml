name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The auth and content API tests run against a real database. Each test
    # creates its own schema and drops it afterwards.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SEDNA_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            package-lock.json
            playground/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix playground

      - name: Lint and format
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Type-check field types
        run: npx tsc -p tests/tsconfig.json

      # The content API test starts the built playground server.
      - name: Build playground
        run: npm run build --prefix playground

      - name: Test
        run: node --test tests/*.test.mjs

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install documentation dependencies
        run: npm ci --prefix docs
      - name: Check documentation
        run: npm run docs:check
      - name: Build documentation
        run: npm run docs:build
